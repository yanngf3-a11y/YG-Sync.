name: Build YG Sync Control

on:
  workflow_dispatch:
  push:
    paths:
      - "controller/**"
      - ".github/workflows/build-controller.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: controller

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YG_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/yg-sync-release.jks

      - name: Verify signing keystore
        run: |
          test -s app/yg-sync-release.jks

          keytool -list \
            -keystore app/yg-sync-release.jks \
            -storepass "${{ secrets.YG_KEYSTORE_PASSWORD }}" \
            -alias ygsync

      - name: Build signed Release APK
        run: |
          gradle --no-daemon \
            -PygsyncKeystore=yg-sync-release.jks \
            -PygsyncStorePassword="${{ secrets.YG_KEYSTORE_PASSWORD }}" \
            -PygsyncKeyAlias=ygsync \
            -PygsyncKeyPassword="${{ secrets.YG_KEYSTORE_PASSWORD }}" \
            assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/YG-Sync-Control.apk

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/YG-Sync-Control.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: YG Sync Control v${{ github.run_number }}
          generate_release_notes: true
          files: controller/app/build/outputs/apk/release/YG-Sync-Control.apk
