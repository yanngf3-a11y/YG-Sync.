name: Build YG Sync Receiver

on:
  workflow_dispatch:
  push:
    paths:
      - "receiver/**"
      - ".github/workflows/build-receiver.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: receiver

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YG_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/yg-sync-release.jks

      - name: Verify signing keystore
        run: |
          test -s app/yg-sync-release.jks
          keytool -list \
            -keystore app/yg-sync-release.jks \
            -storepass "${{ secrets.YG_KEYSTORE_PASSWORD }}" \
            -alias ygsync

      - name: Build signed Debug APK
        run: |
          gradle --no-daemon \
            -PygsyncKeystore=yg-sync-release.jks \
            -PygsyncStorePassword="${{ secrets.YG_KEYSTORE_PASSWORD }}" \
            -PygsyncKeyAlias=ygsync \
            -PygsyncKeyPassword="${{ secrets.YG_KEYSTORE_PASSWORD }}" \
            assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YG-Sync-Receiver-v0.3.0-signed
          path: receiver/app/build/outputs/apk/debug/app-debug.apk
