name: Build YG Sync Receiver

on:
  workflow_dispatch:
  push:
    paths:
      - "receiver/**"
      - ".github/workflows/build-receiver.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: receiver

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify version
        run: |
          echo "YG Sync Receiver"
          echo "Version: 0.3.0"
          echo "Version Code: 3"

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YG-Sync-Receiver-v0.3.0
          path: receiver/app/build/outputs/apk/debug/app-debug.apk
